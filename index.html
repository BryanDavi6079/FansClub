<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>VaultX</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      color: #00ffe7;
    }
    p {
      font-size: 1.2em;
      color: #ccc;
    }
    .container {
      text-align: center;
    }
    a.button {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 20px;
      background: #00ffe7;
      color: #121212;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }
    a.button:hover {
      background: #00ccb8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bem-vindo ao VaultX</h1>
    <p>Este é seu site pessoal criado com HTML.</p>
    <a class="button" href="#">Começar</a>
  </div>
</body>
</html>
